<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect x="0" y="0" width="512" height="512" fill="#080808"/>

    <!-- subtle corner glow, echoes the hero's dark-to-black feel -->
    <rect x="0" y="0" width="512" height="512" fill="#111111" opacity="0.35"/>

    <!-- monogram: bold geometric "L" in warm off-white, sized to stay legible at 16px -->
    <path d="M 168 96
             L 168 344
             L 416 344
             L 416 416
             L 96 416
             L 96 96
             Z"
          fill="#f2efe8"/>

    <!-- signature accent: the lime cursor dot from the site, placed at the L's corner -->
    <circle cx="400" cy="400" r="42" fill="#e8ff47"/>
  </g>
</svg>
